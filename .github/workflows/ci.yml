name: Tests and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANGFUSE_ENABLED: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pytest tests -q --durations=10 --junitxml=reports/pytest.xml 2>&1 | tee reports/pytest.txt
      - name: Write test summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('reports/pytest.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Python test results\n\n')
              if report.exists():
                  root = ET.parse(report).getroot()
                  suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
                  totals = {key: sum(int(s.get(key, '0')) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
                  passed = totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']
                  summary.write('| Total | Passed | Failed | Errors | Skipped |\n| ---: | ---: | ---: | ---: | ---: |\n')
                  summary.write(f"| {totals['tests']} | {passed} | {totals['failures']} | {totals['errors']} | {totals['skipped']} |\n\n")
                  summary.write('Download the `pytest-results` artifact for JUnit XML and full output.\n')
              else:
                  summary.write('No JUnit report was produced. Check the installation and test logs.\n')
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pytest-results
          path: |
            reports/pytest.xml
            reports/pytest.txt
          retention-days: 30
          if-no-files-found: warn

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Type check and build
        run: npm --prefix frontend run build
